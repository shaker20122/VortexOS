name: Build VortexOS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Write build script
        run: |
          cat > build-vortexos.sh <<'SCRIPT_EOF'
          #!/bin/bash
          set -e

          echo '=== 1. Install build packages ==='
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm archiso grub syslinux mtools dosfstools xorriso efibootmgr findutils rsync

          echo '=== 2. Start from the official releng template ==='
          mkdir -p /tmp/profile
          cp -r /usr/share/archiso/configs/releng/* /tmp/profile/

          echo '=== 3. Merge repo files, protecting grub/syslinux/efiboot placeholders ==='
          rsync -a --exclude='.git/' \
                   --exclude='.github/' \
                   --exclude='grub/' \
                   --exclude='syslinux/' \
                   --exclude='efiboot/' \
                   --exclude='out/' \
                   --exclude='build-vortexos.sh' \
                   /workspace/ /tmp/profile/

          echo '=== 4. Patch ONLY the visible menu titles - never kernel cmdline lines ==='
          sed -i '/^menuentry "/ s/Arch Linux/VortexOS/g' /tmp/profile/grub/grub.cfg
          sed -i '/^[[:space:]]*MENU LABEL/ s/Arch Linux/VortexOS/g' /tmp/profile/syslinux/*.cfg
          sed -i '/^[[:space:]]*MENU TITLE/ s/Arch Linux/VortexOS/g' /tmp/profile/syslinux/*.cfg

          echo '=== 5. Run mkarchiso (injects iso_label from profiledef.sh itself) ==='
          mkdir -p /workspace/out
          mkarchiso -v -w /tmp/archiso-tmp -o /workspace/out /tmp/profile

          echo '=== 6. Checksum, generated by the same root UID that owns out/ ==='
          cd /workspace/out
          sha256sum *.iso > VortexOS.sha256
          SCRIPT_EOF
          chmod +x build-vortexos.sh

      - name: Build ISO using Arch Linux Docker Container
        run: |
          docker run --privileged --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            archlinux:latest ./build-vortexos.sh

      - name: Real Boot Test - BIOS Path
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-x86
          ISO=$(find out -name "*.iso" | head -n 1)
          echo "Testing BIOS boot for: $ISO"
          timeout 600 qemu-system-x86_64 -m 2048 -cdrom "$ISO" -boot d \
            -vga none -nographic -serial mon:stdio -display none \
            | tee boot-bios.log || true

          if grep -qE "Failed to mount|Emergency Shell|Kernel panic" boot-bios.log; then
            echo "::error::Explicit boot failure detected (BIOS)"
            cat boot-bios.log
            exit 1
          elif grep -q "login:" boot-bios.log || grep -q "Reached target" boot-bios.log; then
            echo "BIOS boot succeeded"
          else
            echo "::error::Boot outcome inconclusive (BIOS)"
            cat boot-bios.log
            exit 1
          fi

      - name: Real Boot Test - UEFI Path
        run: |
          sudo apt-get install -y ovmf
          ISO=$(find out -name "*.iso" | head -n 1)
          echo "Testing UEFI boot for: $ISO"
          cp /usr/share/OVMF/OVMF_CODE_4M.fd /tmp/OVMF_CODE.fd
          cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/OVMF_VARS.fd

          timeout 600 qemu-system-x86_64 -m 2048 -cdrom "$ISO" -boot d \
            -drive if=pflash,format=raw,readonly=on,file=/tmp/OVMF_CODE.fd \
            -drive if=pflash,format=raw,file=/tmp/OVMF_VARS.fd \
            -vga none -nographic -serial mon:stdio -display none \
            | tee boot-uefi.log || true

          if grep -qE "Failed to mount|Emergency Shell|Kernel panic" boot-uefi.log; then
            echo "::error::Explicit boot failure detected (UEFI)"
            cat boot-uefi.log
            exit 1
          elif grep -q "login:" boot-uefi.log || grep -q "Reached target" boot-uefi.log; then
            echo "UEFI boot succeeded"
          else
            echo "::error::Boot outcome inconclusive (UEFI)"
            cat boot-uefi.log
            exit 1
          fi

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VortexOS-ISO
          path: |
            out/*.iso
            out/*.sha256
          retention-days: 14
