name: Build VortexOS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Write build script
        run: |
          cat > build-vortexos.sh <<'SCRIPT_EOF'
          #!/bin/bash
          set -e

          echo '=== 1. تثبيت حزم البناء ==='
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm archiso grub syslinux mtools dosfstools xorriso efibootmgr findutils rsync

          echo '=== 2. تجهيز البروفايل من القالب الرسمي ==='
          mkdir -p /tmp/profile
          cp -r /usr/share/archiso/configs/releng/* /tmp/profile/

          echo '=== 3. دمج ملفات المستودع ==='
          rsync -a --exclude='.git/' \
                   --exclude='.github/' \
                   --exclude='grub/' \
                   --exclude='syslinux/' \
                   --exclude='efiboot/' \
                   /workspace/ /tmp/profile/

          echo '=== 4. ترقيع العناوين النصية بأمان (بدون المساس بمعاملات الإقلاع) ==='
          # GRUB
          sed -i '/^[[:space:]]*menuentry/ s/Arch Linux/Vortex OS/g' /tmp/profile/grub/grub.cfg 2>/dev/null || true
          # Syslinux
          sed -i '/^[[:space:]]*MENU LABEL/ s/Arch Linux/Vortex OS/g' /tmp/profile/syslinux/*.cfg 2>/dev/null || true
          sed -i '/^[[:space:]]*MENU TITLE/ s/Arch Linux/Vortex OS/g' /tmp/profile/syslinux/*.cfg 2>/dev/null || true
          # Systemd-boot (efiboot)
          sed -i '/^title/ s/Arch Linux/Vortex OS/g' /tmp/profile/efiboot/loader/entries/*.conf 2>/dev/null || true

          echo '=== 5. تشغيل mkarchiso 🚀 ==='
          mkdir -p /workspace/out
          mkarchiso -v -w /tmp/archiso-tmp -o /workspace/out /tmp/profile

          echo '=== 6. توليد الـ Checksum ==='
          cd /workspace/out
          sha256sum *.iso > VortexOS.sha256
          SCRIPT_EOF
          chmod +x build-vortexos.sh

      - name: Build ISO using Arch Linux Docker Container
        run: |
          docker run --privileged --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            archlinux:latest ./build-vortexos.sh

      - name: Real Boot Test - BIOS Path
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-x86
          ISO=$(find out -name "*.iso" | head -n 1)
          echo "Testing BIOS Boot for ISO: $ISO"
          timeout 120 qemu-system-x86_64 -m 2048 -cdrom "$ISO" -boot d \
            -nographic -serial mon:stdio -display none | tee boot-bios.log || true
          
          if grep -qE "Failed to mount|Emergency Shell|Kernel panic" boot-bios.log; then
            echo "::error::تم رصد فشل صريح في الإقلاع"
            cat boot-bios.log
            exit 1
          elif grep -qE "login:|Reached target|Probing EDD|vmlinuz-linux" boot-bios.log; then
            echo "✅ نجح إقلاع BIOS ودخلت النواة في الخدمة بنجاح!"
          else
            echo "::error::لم يتم رصد إقلاع للنظام"
            cat boot-bios.log
            exit 1
          fi

      - name: Real Boot Test - UEFI Path
        run: |
          sudo apt-get install -y ovmf
          ISO=$(find out -name "*.iso" | head -n 1)
          echo "Testing UEFI Boot for ISO: $ISO"
          
          OVMF_CODE=$(find /usr/share -name "OVMF_CODE*.fd" ! -name "*snakeoil*" ! -name "*secboot*" | head -n 1)
          OVMF_VARS=$(find /usr/share -name "OVMF_VARS*.fd" ! -name "*snakeoil*" ! -name "*secboot*" | head -n 1)
          
          if [ -z "$OVMF_CODE" ]; then
            OVMF_CODE=$(find /usr/share -name "OVMF_CODE*.fd" | head -n 1)
            OVMF_VARS=$(find /usr/share -name "OVMF_VARS*.fd" | head -n 1)
          fi
          
          cp "$OVMF_CODE" /tmp/OVMF_CODE.fd
          cp "$OVMF_VARS" /tmp/OVMF_VARS.fd
          
          timeout 120 qemu-system-x86_64 -m 2048 -cdrom "$ISO" -boot d \
            -drive if=pflash,format=raw,readonly=on,file=/tmp/OVMF_CODE.fd \
            -drive if=pflash,format=raw,file=/tmp/OVMF_VARS.fd \
            -net none -nographic -serial stdio | tee boot-uefi.log || true
          
          if grep -qE "Failed to mount|Emergency Shell|Kernel panic" boot-uefi.log; then
            echo "::error::تم رصد فشل صريح في الإقلاع"
            cat boot-uefi.log
            exit 1
          else
            echo "✅ نجح فحص ملفات إقلاع UEFI بدون أخطاء كارثية!"
          fi

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VortexOS-ISO
          path: |
            out/*.iso
            out/*.sha256
          retention-days: 14
