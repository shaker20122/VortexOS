name: Build VortexOS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Write build script
        run: |
          cat > build-vortexos.sh <<'SCRIPT_EOF'
          #!/bin/bash
          set -e

          echo '=== 1. تثبيت حزم البناء ==='
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm archiso grub syslinux mtools dosfstools xorriso efibootmgr findutils rsync

          echo '=== 2. تجهيز البروفايل من القالب الرسمي ==='
          mkdir -p /tmp/profile
          cp -r /usr/share/archiso/configs/releng/* /tmp/profile/

          echo '=== 3. دمج ملفات المستودع (باستثناء مجلدات الإقلاع القديمة) ==='
          rsync -a --exclude='.git/' \
                   --exclude='.github/' \
                   --exclude='grub/' \
                   --exclude='syslinux/' \
                   --exclude='efiboot/' \
                   /workspace/ /tmp/profile/

          echo '=== 4. ترقيع العناوين النصية فقط ==='
          find /tmp/profile/grub /tmp/profile/syslinux /tmp/profile/efiboot \
               -type f \( -name '*.cfg' -o -name '*.conf' -o -name '*.entry' \) 2>/dev/null \
               | xargs -r sed -i 's/Arch Linux install medium/Vortex OS Live Medium/g; s/Arch Linux/Vortex OS/g'

          echo '=== 5. تشغيل mkarchiso 🚀 ==='
          mkdir -p /workspace/out
          mkarchiso -v -w /tmp/archiso-tmp -o /workspace/out /tmp/profile
          SCRIPT_EOF
          chmod +x build-vortexos.sh

      - name: Build ISO using Arch Linux Docker Container
        run: |
          docker run --privileged --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            archlinux:latest ./build-vortexos.sh

      - name: Generate Checksum
        run: |
          sha256sum out/*.iso > out/VortexOS.sha256

      - name: Real Boot Test - BIOS Path
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-x86
          ISO=$(find out -name "*.iso" | head -n 1)
          echo "Testing BIOS Boot for ISO: $ISO"
          timeout 120 qemu-system-x86_64 -m 2048 -cdrom "$ISO" -boot d \
            -nographic -serial mon:stdio -display none | tee boot-bios.log || true
          
          if grep -qE "Failed to mount|Emergency Shell|Kernel panic" boot-bios.log; then
            echo "::error::تم رصد فشل صريح في الإقلاع"
            cat boot-bios.log
            exit 1
          elif grep -q "login:" boot-bios.log || grep -q "Reached target" boot-bios.log; then
            echo "✅ نجح إقلاع BIOS والوصول لهدف النظام!"
          else
            echo "::error::لم يصل الإقلاع لا لحالة نجاح واضحة ولا فشل واضح — راجع اللوق"
            cat boot-bios.log
            exit 1
          fi

      - name: Real Boot Test - UEFI Path
        run: |
          sudo apt-get install -y ovmf
          ISO=$(find out -name "*.iso" | head -n 1)
          echo "Testing UEFI Boot for ISO: $ISO"
          cp /usr/share/OVMF/OVMF_CODE.fd /tmp/OVMF_CODE.fd
          cp /usr/share/OVMF/OVMF_VARS.fd /tmp/OVMF_VARS.fd
          
          timeout 120 qemu-system-x86_64 -m 2048 -cdrom "$ISO" -boot d \
            -drive if=pflash,format=raw,readonly=on,file=/tmp/OVMF_CODE.fd \
            -drive if=pflash,format=raw,file=/tmp/OVMF_VARS.fd \
            -nographic -serial mon:stdio -display none | tee boot-uefi.log || true
          
          if grep -qE "Failed to mount|Emergency Shell|Kernel panic" boot-uefi.log; then
            echo "::error::تم رصد فشل صريح في الإقلاع"
            cat boot-uefi.log
            exit 1
          elif grep -q "login:" boot-uefi.log || grep -q "Reached target" boot-uefi.log; then
            echo "✅ نجح إقلاع UEFI والوصول لهدف النظام!"
          else
            echo "::error::لم يصل الإقلاع لا لحالة نجاح واضحة ولا فشل واضح — راجع اللوق"
            cat boot-uefi.log
            exit 1
          fi

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VortexOS-ISO
          path: |
            out/*.iso
            out/*.sha256
          retention-days: 14
