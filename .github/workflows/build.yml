name: Build VortexOS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build ISO in Arch Linux Docker
        run: |
          docker run --privileged --rm -v ${{ github.workspace }}:/workspace archlinux:latest bash -c "
            pacman -Syu --noconfirm archiso && \
            cd /workspace && \
            DIR=\$(find . -name profiledef.sh -exec dirname {} \; | head -n 1) && \
            echo \"Building from directory: \$DIR\" && \
            mkarchiso -v -w /tmp/archiso-tmp -o /workspace/out \"\$DIR\"
          "

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VortexOS-ISO
          path: out/*.iso
