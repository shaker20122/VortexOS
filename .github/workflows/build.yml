name: Build VortexOS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Arch ISO using Arch Linux Docker Container
        run: |
          docker run --privileged --rm -v ${{ github.workspace }}:/workspace archlinux:latest bash -c "
            pacman -Syu --noconfirm archiso && \
            cd /workspace && \
            if [ -f 'profiledef.sh' ]; then
              PROFILE_DIR='.'
            elif [ -d 'VortexOS' ] && [ -f 'VortexOS/profiledef.sh' ]; then
              PROFILE_DIR='VortexOS'
            else
              PROFILE_DIR=\$(find . -name 'profiledef.sh' -exec dirname {} \;)
            fi && \
            echo \"Building from profile directory: \$PROFILE_DIR\" && \
            mkarchiso -v -w /tmp/archiso-tmp -o /workspace/out \"\$PROFILE_DIR\"
          "

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VortexOS-ISO
          path: out/*.iso
