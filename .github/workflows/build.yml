name: Build VortexOS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build ISO using Arch Linux Docker Container
        run: |
          docker run --privileged --rm -v ${{ github.workspace }}:/workspace archlinux:latest bash -c "
            set -euo pipefail
            
            echo '=== 1. تهيئة المفاتيح والحزم ==='
            pacman -Sy --noconfirm archlinux-keyring
            pacman-key --init
            pacman-key --populate archlinux
            pacman -Syu --noconfirm archiso grub syslinux mtools dosfstools xorriso efibootmgr
            
            cd /workspace
            
            echo '=== 2. تحديد مجلد البروفايل ==='
            # البحث عن مجلد profiledef.sh المباشر (تجاهل المجلد الرئيسي /workspace نفسه)
            DIR=\$(find . -mindepth 2 -name profiledef.sh -exec dirname {} \; | head -n 1)
            
            # إذا لم يجده في المجلدات الفرعية، نتحقق من مجلد VortexOS أو المجلد الحالي
            if [ -z \"\$DIR\" ]; then
              if [ -f \"VortexOS/profiledef.sh\" ]; then
                DIR=\"VortexOS\"
              elif [ -f \"profiledef.sh\" ]; then
                DIR=\".\"
              else
                echo \"ERROR: profiledef.sh not found!\"
                exit 1
              fi
            fi
            
            echo \"Building from profile directory: \$DIR\"
            
            echo '=== 3. تشغيل البناء 🚀 ==='
            mkarchiso -v -w /tmp/archiso-tmp -o /workspace/out \"\$DIR\"
          "

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VortexOS-ISO
          path: out/*.iso
