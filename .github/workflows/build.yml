name: Build VortexOS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Write build script
        run: |
          cat > build-vortexos.sh <<'SCRIPT_EOF'
          #!/bin/bash
          set -e

          echo '=== 1. Initialize Keys & Install Dependencies ==='
          pacman-key --init
          pacman-key --populate archlinux

          # Mask mkinitcpio hooks to prevent pacman transaction failure in container
          mkdir -p /etc/pacman.d/hooks
          ln -sf /dev/null /etc/pacman.d/hooks/90-mkinitcpio-install.hook
          ln -sf /dev/null /etc/pacman.d/hooks/60-mkinitcpio-remove.hook

          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm base-devel archiso grub syslinux mtools dosfstools xorriso efibootmgr findutils rsync

          echo '=== 2. Setup Profile & Merge Sources ==='
          mkdir -p /tmp/profile
          cp -r /usr/share/archiso/configs/releng/* /tmp/profile/

          # Protect bootloader directory structures while syncing repository
          rsync -a --exclude='.git/' \
                    --exclude='.github/' \
                    --exclude='grub/' \
                    --exclude='syslinux/' \
                    --exclude='efiboot/' \
                    --exclude='out/' \
                    --exclude='build-vortexos.sh' \
                    /workspace/ /tmp/profile/

          echo '=== 3. Inject Serial Console & Kernel Flags ==='
          sed -i '/^menuentry "/ s/Arch Linux/VortexOS/g' /tmp/profile/grub/grub.cfg

          # Safely append parameters for Syslinux & GRUB to enable QEMU serial output
          for cfg in /tmp/profile/syslinux/*.cfg; do
            [ -f "$cfg" ] && sed -i '/^[[:space:]]*APPEND/ s|$| edd=off console=ttyS0|' "$cfg"
          done
          sed -i '/^[[:space:]]*linux /{ /console=ttyS0/! s|$| edd=off console=ttyS0|; }' /tmp/profile/grub/grub.cfg

          echo '=== 4. Execute mkarchiso Build ==='
          mkdir -p /workspace/out
          mkarchiso -v -w /tmp/archiso-tmp -o /workspace/out /tmp/profile

          echo '=== 5. Generate SHA256 Checksum ==='
          cd /workspace/out
          sha256sum *.iso > VortexOS.sha256
          SCRIPT_EOF
          chmod +x build-vortexos.sh

      - name: Build ISO via Arch Container
        run: |
          docker run --privileged --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            archlinux:base-devel ./build-vortexos.sh

      - name: Verify BIOS Boot (QEMU)
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-x86
          ISO=$(find out -name "*.iso" | head -n 1)
          timeout 600 qemu-system-x86_64 -m 2048 -cdrom "$ISO" -boot d \
            -vga none -nographic -serial mon:stdio -display none \
            | tee boot-bios.log || true

          if grep -qE "Failed to mount|Emergency Shell|Kernel panic" boot-bios.log; then
            echo "::error::BIOS Boot Failed" && cat boot-bios.log && exit 1
          elif grep -qE "login:|Reached target" boot-bios.log; then
            echo "BIOS Boot Successful!"
          else
            echo "::error::Inconclusive Boot Outcome" && cat boot-bios.log && exit 1
          fi

      - name: Verify UEFI Boot (QEMU)
        run: |
          sudo apt-get install -y ovmf
          ISO=$(find out -name "*.iso" | head -n 1)
          cp /usr/share/OVMF/OVMF_CODE_4M.fd /tmp/OVMF_CODE.fd
          cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/OVMF_VARS.fd

          timeout 600 qemu-system-x86_64 -m 2048 -cdrom "$ISO" -boot d \
            -drive if=pflash,format=raw,readonly=on,file=/tmp/OVMF_CODE.fd \
            -drive if=pflash,format=raw,file=/tmp/OVMF_VARS.fd \
            -vga none -nographic -serial mon:stdio -display none \
            | tee boot-uefi.log || true

          if grep -qE "Failed to mount|Emergency Shell|Kernel panic" boot-uefi.log; then
            echo "::error::UEFI Boot Failed" && cat boot-uefi.log && exit 1
          elif grep -qE "login:|Reached target" boot-uefi.log; then
            echo "UEFI Boot Successful!"
          else
            echo "::error::Inconclusive Boot Outcome" && cat boot-uefi.log && exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VortexOS-ISO
          path: |
            out/*.iso
            out/*.sha256
          retention-days: 14
