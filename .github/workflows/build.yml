name: Build VortexOS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build ISO using Arch Linux Docker Container
        run: |
          docker run --privileged --rm -v ${{ github.workspace }}:/workspace archlinux:latest bash -c "
            set -euo pipefail

            echo '=== 1. تهيئة المفاتيح والحزم ==='
            pacman-key --init || {
              pacman -Sy --noconfirm haveged
              systemctl start haveged || /usr/bin/haveged -w 1024 &
              pacman-key --init
            }
            pacman-key --populate archlinux
            pacman -Sy --noconfirm archlinux-keyring
            pacman -Syu --noconfirm archiso grub syslinux mtools dosfstools xorriso efibootmgr

            echo '=== 2. تجميع ملفات البروفايل في مجلد موحد ==='
            mkdir -p /tmp/build_profile
            
            # 1. نقل ملفات المجلد الرئيسي إن وجدت (مثل profiledef.sh و packages)
            cp -r /workspace/* /tmp/build_profile/ 2>/dev/null || true
            
            # 2. نقل ملفات مجلد VortexOS لدمجها بنفس المجلد
            if [ -d '/workspace/VortexOS' ]; then
              cp -r /workspace/VortexOS/* /tmp/build_profile/
            fi

            cd /tmp/build_profile
            echo 'محتويات مجلد البناء النهائي:'
            ls -la

            echo '=== 3. تشغيل البناء 🚀 ==='
            mkarchiso -v -w /tmp/archiso-tmp -o /workspace/out .
          "

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VortexOS-ISO
          path: out/*.iso
