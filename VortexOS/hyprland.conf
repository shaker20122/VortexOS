# ============================================
#       Vortex OS - Main Hyprland Config
# ============================================

# 1. Monitor Setup
monitor=,preferred,auto,1

# 2. Autostart Applications & Services
exec-once = waybar -c ~/.config/waybar/waybar-config.jsonc -s ~/.config/waybar/style.css &
exec-once = awww-daemon &
exec-once = sleep 1 && awww img ~/.config/hypr/backgrounds/vortex-space.png --transition-type grow &
exec-once = rofi -e "Welcome to Vortex OS | Super+R: Apps | Super+Q: Terminal" &

# 3. Look and Feel
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(8b5cf6ee) rgba(d946efee) 45deg
    col.inactive_border = rgba(1e1e2ee0)
    layout = dwindle
}

decoration {
    rounding = 8
    drop_shadow = true
    shadow_range = 4
}

# 4. Keybindings
$mainMod = SUPER

bind = $mainMod, Q, exec, kitty
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, dolphin
bind = $mainMod, R, exec, rofi -show drun
bind = $mainMod, B, exec, firefox
bind = $mainMod, A, exec, bauh