LABEL arch64
TEXT HELP
Boot the Vortex OS install medium on BIOS.
It allows you to install Vortex OS or perform system maintenance.
ENDTEXT
MENU LABEL Vortex OS Live Medium (x86_64, BIOS)
LINUX /arch/boot/x86_64/vmlinuz-linux
INITRD /arch/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=arch archisolabel=VortexOS

LABEL arch64speech
TEXT HELP
Boot the Vortex OS install medium on BIOS with speakup screen reader.
ENDTEXT
MENU LABEL Vortex OS Live Medium with speakup screen reader (x86_64, BIOS)
LINUX /arch/boot/x86_64/vmlinuz-linux
INITRD /arch/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=arch archisolabel=VortexOS accessibility=on
